name: sitepackage/service-card
typeName: sitepackage_service_card
group: default
prefixFields: true
prefixType: full
fields:
  -
    identifier: icon
    type: Select
    label: 'Icon (Material Symbols Outlined name)'
    renderType: selectSingle
    items:
      - { label: Upgrade, value: upgrade }
      - { label: 'API / Integration', value: api }
      - { label: 'History / Legacy', value: history_edu }
      - { label: Payments, value: payments }
      - { label: Speed, value: speed }
      - { label: Accessibility, value: accessibility_new }
      - { label: Hub, value: hub }
      - { label: Security, value: security }
  -
    identifier: header
    useExistingField: true
    label: Title
  -
    identifier: description
    type: Textarea
    label: Description
  -
    identifier: tech_specs
    type: Collection
    label: 'TECH_SPECS bullet list'
    labelField: text
    fields:
      -
        identifier: text
        type: Text
        label: Item
        placeholder: 'e.g. 13+ Successful Migrations'
