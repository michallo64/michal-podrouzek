name: sitepackage/project-card
typeName: sitepackage_project_card
group: default
prefixFields: true
prefixType: full
fields:
  -
    identifier: status
    type: Select
    label: Status
    renderType: selectSingle
    items:
      - { label: Stable, value: stable }
      - { label: Critical, value: critical }
      - { label: Archived, value: archived }
    default: stable
    minitems: 1
  -
    identifier: header
    useExistingField: true
    label: 'Project title'
  -
    identifier: description
    type: Textarea
    label: Description
  -
    identifier: scale
    type: Text
    label: 'Scale / hour range'
    placeholder: 'e.g. 140-160 HOURS'
  -
    identifier: tech_tags
    type: Collection
    label: 'Tech tags'
    labelField: text
    fields:
      -
        identifier: text
        type: Text
        label: Tag
        placeholder: 'e.g. TYPO3 13 LTS'
