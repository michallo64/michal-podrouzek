name: sitepackage/project-card
typeName: sitepackage_project_card
group: default
prefixFields: true
prefixType: full
fields:
  -
    identifier: header
    useExistingField: true
    label: 'Project title'
  -
    identifier: project_type
    type: Text
    label: 'Project type'
    placeholder: 'e.g. Retail, Professional services'
  -
    identifier: tech_stack
    type: Text
    label: 'Tech stack'
    placeholder: 'Comma-separated, e.g. TYPO3, PHP, Stripe'
  -
    identifier: scale
    type: Text
    label: 'Scale / hour range'
    placeholder: 'e.g. 40-60h, ~60 pages'
  -
    identifier: description
    type: Textarea
    label: Description
