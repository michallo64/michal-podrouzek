name: sitepackage/timeline-entry
typeName: sitepackage_timeline_entry
group: default
prefixFields: true
prefixType: full
fields:
  -
    identifier: is_current
    type: Checkbox
    label: 'Current (filled node, highlighted date)'
  -
    identifier: date_range
    type: Text
    label: 'Year / date range'
    placeholder: 'e.g. 2022–2024'
  -
    identifier: header
    useExistingField: true
    label: Title
  -
    identifier: location
    type: Text
    label: 'Company / location'
    placeholder: 'e.g. DEVSK s. r. o., Bratislava'
  -
    identifier: description
    type: Textarea
    label: 'Description (optional)'
