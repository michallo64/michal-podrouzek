<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Preview"/>

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">TECH_REGISTRY</cb:link.editRecord>
</f:section>

<f:section name="Content">
    <f:groupedFor each="{data.badges}" as="badgesInGroup" groupBy="group_label" groupKey="groupLabel">{groupLabel} (<f:for each="{badgesInGroup}" as="badge" iteration="j"><f:if condition="{j.isFirst} == false">, </f:if>{badge.label}</f:for>) </f:groupedFor>
</f:section>

</html>
