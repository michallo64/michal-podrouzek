<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<div class="ce-panel ce-tech-badge-list">
    <div class="ce-panel__header">
        <span class="material-symbols-outlined">data_object</span>
        <h2 class="text-headline-card"><f:translate key="{cb:languagePath()}:label.tech_stack" /></h2>
    </div>
    <f:groupedFor each="{data.badges}" as="badgesInGroup" groupBy="group_label" groupKey="groupLabel">
        <div class="ce-tech-badge-list__group">
            <f:if condition="{groupLabel}">
                <h4 class="text-label-mono ce-tech-badge-list__group-label">{groupLabel}</h4>
            </f:if>
            <ul class="ce-tech-badge-list__badges">
                <f:for each="{badgesInGroup}" as="badge">
                    <li class="ce-tech-badge-list__badge text-label-tiny">{badge.label}</li>
                </f:for>
            </ul>
        </div>
    </f:groupedFor>
</div>
</html>
