name: sitepackage/tech-badge-list
typeName: sitepackage_tech_badge_list
group: default
prefixFields: true
prefixType: full
fields:
  -
    identifier: badges
    type: Collection
    label: 'Badges — keep rows in the same group adjacent, rendering groups them by "Group label" in order of appearance'
    labelField: label
    minitems: 1
    fields:
      -
        identifier: group_label
        type: Text
        label: 'Group label'
        placeholder: 'e.g. ENV.CORE'
      -
        identifier: label
        type: Text
        label: Badge
        placeholder: 'e.g. TYPO3 v13, PHP 8.x'
